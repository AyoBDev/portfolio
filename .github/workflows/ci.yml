name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Lighthouse needs the built site; the Playwright run above builds it, but build again so this step stands alone.
      - run: npm run build
      - run: npx lhci autorun
      # Keeps the full Lighthouse reports so a failing or slow run can be inspected.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # The reports folder starts with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          retention-days: 14
