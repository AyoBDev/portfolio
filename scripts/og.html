<!doctype html>
<!-- Source for public/og.png (1200x630). Standalone: brand values are inlined.
     Regenerate: open this file at a 1200x630 viewport and screenshot it. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Share image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background-color: #D8FF00;
    background-image:
      linear-gradient(rgba(16, 44, 64, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(16, 44, 64, 0.1) 1px, transparent 1px);
    background-size: 60px 60px;
    font-family: 'Poppins', sans-serif;
    color: #102C40;
    text-transform: uppercase;
  }
  .byline {
    position: absolute; left: 80px; top: 70px;
    font-weight: 800; font-size: 34px; letter-spacing: 0.12em;
  }
  .headline {
    position: absolute; left: 80px; top: 125px; width: 1060px;
    font-weight: 900; font-size: 100px; line-height: 1; letter-spacing: -0.01em;
  }
  .band {
    position: absolute; left: 60px; right: 60px; bottom: 62px;
    background: #102C40; color: #F7FAFC;
    padding: 26px 40px;
    font-weight: 800; font-size: 40px; letter-spacing: 0.04em;
    transform: rotate(-1.5deg);
  }
</style>
</head>
<body>
  <p class="byline">Ayomikun Ayobami</p>
  <h1 class="headline">Systems &amp; Cloud Engineer</h1>
  <p class="band">AWS Solutions Architect &ndash; Professional</p>
</body>
</html>
